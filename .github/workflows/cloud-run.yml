name: Cloud Run

on:
  push:
    branches: [main]
    paths:
      - server/**
      - shared/**
      - src/**
      - public/**
      - index.html
      - vite.config.ts
      - tsconfig*.json
      - Dockerfile
      - package.json
      - package-lock.json
      - .github/workflows/cloud-run.yml
  workflow_dispatch:

jobs:
  test:
    name: Validate Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GENERATION_PASSPHRASE: ${{ secrets.GENERATION_PASSPHRASE }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          gcloud config set project "$PROJECT"
          
          ENV_VARS=""
          for var in "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" "GEMINI_API_KEY=$GEMINI_API_KEY" "POLLINATIONS_API_KEY=$POLLINATIONS_API_KEY" "HF_TOKEN=$HF_TOKEN" "GENERATION_PASSPHRASE=$GENERATION_PASSPHRASE" "CORS_ORIGIN=$CORS_ORIGIN"; do
            val="${var#*=}"
            if [ -n "$val" ]; then
              if [ -z "$ENV_VARS" ]; then
                ENV_VARS="$var"
              else
                ENV_VARS="$ENV_VARS,$var"
              fi
            fi
          done
          
          if [ -n "$ENV_VARS" ]; then
            gcloud run deploy bestiary-api \
              --source . \
              --region us-central1 \
              --allow-unauthenticated \
              --memory 512Mi \
              --timeout 120 \
              --min-instances 0 \
              --set-env-vars "$ENV_VARS"
          else
            gcloud run deploy bestiary-api \
              --source . \
              --region us-central1 \
              --allow-unauthenticated \
              --memory 512Mi \
              --timeout 120 \
              --min-instances 0
          fi

